spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketflow}
    username: ${DB_USER:marketflow}
    password: ${DB_PASSWORD:marketflow}
  jpa: {hibernate: {ddl-auto: validate}, open-in-view: false}
app:
  jwt: {secret: "${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}", ttl-minutes: 720}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
